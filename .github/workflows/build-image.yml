name: Build Docker image

# Builds the image, without publishing it, for pull requests that change how it is built. Mainly a check for the
# Renovate PRs that bump the native libraries: a version that no longer builds fails here instead of at deploy time.
on:
    pull_request:
        paths:
            - Dockerfile
            - .dockerignore
            - docker/**

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # the build derives its version from git tags

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64
                  push: false
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
